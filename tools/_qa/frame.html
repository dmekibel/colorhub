<!doctype html>
<!-- QA: render the app at a true phone width inside an iframe (headless Chrome won't size its window below
     ~500px, so media queries and innerWidth need a frame). Used by tools/_qa/frameshots.sh.
     frame.html?w=375&h=812&hash=<#shot=… or #/…>&js=<code run inside the app after `wait` ms>&wait=1500 -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById("f");
f.width = q.get("w") || 375; f.height = q.get("h") || 812;
f.src = "../../index.html" + (q.get("hash") || "#shot=learn");
f.onload = () => { const js = q.get("js"); if (js) setTimeout(() => { try { f.contentWindow.eval(js); } catch (e) { console.error(e); } }, +(q.get("wait") || 1500)); };
</script>
