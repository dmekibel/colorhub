<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0D0B">
<title>Color Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Night Gallery tokens (design/VISUAL-DIRECTION.md) */
:root{
  --ground:#0E0D0B; --s1:#171512; --s2:#201E1A; --s3:#2B2823;
  --line:rgba(236,232,223,.10); --line-2:rgba(236,232,223,.22);
  --ink:#ECE8DF; --soft:#A39E92; --faint:#7C776C;
  --paper:#EFEBE3; --paper-ink:#141311; --good:#9AD4AE; --bad:#F09A86;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-tile:6px; --r-card:18px; --r-sheet:28px; --ease:cubic-bezier(.2,.8,.2,1);
  --g:16px; --c:#ECE8DF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--g) 0;position:relative}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:6px}
.kicker{font:italic 400 17px/1.2 var(--serif);color:var(--soft);margin:0 0 2px}
h1{font:400 48px/.92 var(--serif);letter-spacing:-.02em;margin:0}
.sub{font:400 14px/1.4 var(--sans);color:var(--soft);margin:8px 0 0}
.who{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.who button{height:36px;padding:0 12px 0 8px;border-radius:999px;display:flex;align-items:center;gap:7px;font:500 14px var(--sans);color:var(--soft)}
.who button i{width:14px;height:14px;border-radius:50%;display:block}
.who button[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}

.views{display:flex;gap:6px;margin:16px calc(-1 * var(--g)) 0;padding:0 var(--g) 2px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);padding-right:56px}
.views button{flex:none;height:44px;padding:0 16px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font:500 15px var(--sans);color:var(--soft);display:flex;align-items:center;gap:8px;transition:transform .12s var(--ease)}
.views button:active{transform:scale(.96)}
.views button[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2);border-color:transparent}
.views button[aria-pressed=true]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* the stage */
.lede{font:400 23px/1.18 var(--serif);margin:18px 0 12px;min-height:54px;text-wrap:pretty}
.lede em{font-style:italic;color:var(--soft)}
.stage{position:relative}
svg{display:block;overflow:visible}
.field{touch-action:manipulation}
.bub{cursor:pointer}
.bub circle{transition:opacity .2s}
.lbl{font:400 13px var(--serif);pointer-events:none}
.lbl.s{font:500 12px var(--sans);font-variant-numeric:tabular-nums;opacity:.8}
.axis{font:400 12px var(--sans);fill:var(--faint)}
.guide{fill:none;stroke:var(--line);stroke-width:1}

/* readout (a selected color, in place: no sheet) */
.read{margin:14px 0 0;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;display:grid;grid-template-columns:96px 1fr;gap:14px;animation:rise .28s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.plate{display:block;border-radius:var(--r-tile);min-height:96px;position:relative}
.plate.hair{box-shadow:inset 0 0 0 1px var(--line)}
.read h3{font:400 30px/1 var(--serif);margin:2px 0 6px}
.read h3 a{color:inherit;text-decoration:none}
.read p{margin:0;font-size:15px;line-height:1.4;color:var(--soft)}
.read .when{grid-column:1/-1}
.thumbs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.thumbs img{height:64px;border-radius:var(--r-tile);display:block;background:var(--s2)}

/* dock: controls in the thumb zone */
.dock{position:sticky;bottom:0;margin:18px calc(-1 * var(--g)) 0;padding:12px var(--g) calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--s1);border-top:1px solid var(--line);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -16px 48px rgba(0,0,0,.5);z-index:5}
.row{display:flex;align-items:center;gap:12px;min-height:48px}
.row + .row{margin-top:4px}
.row .k{font:500 15px var(--sans);color:var(--soft);width:66px;flex:none}
.row .v{font:500 15px var(--sans);font-variant-numeric:tabular-nums;width:58px;text-align:right;flex:none}
.seg{display:flex;gap:4px;background:var(--ground);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none;flex:1}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:40px;padding:0 13px;border-radius:999px;font:500 14px var(--sans);color:var(--soft);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.slider{position:relative;flex:1;height:44px;touch-action:none;cursor:pointer}
.slider .tr{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:var(--s3)}
.slider .fi{position:absolute;left:0;top:19px;height:6px;border-radius:3px;background:var(--ink)}
.slider .th{position:absolute;top:8px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.range .bars{position:absolute;left:0;right:0;bottom:22px;height:22px;display:flex;align-items:flex-end;gap:1px}
.range .bars i{flex:1;border-radius:2px 2px 0 0;min-height:2px;opacity:.35;transition:opacity .15s}
.range .bars i.on{opacity:1}
.range{height:60px}
.range .tr,.range .fi{top:41px}.range .th{top:30px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 12px;border-radius:999px;background:var(--s2);font:500 14px var(--sans);color:var(--soft);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}

/* years */
.yr{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;height:19px;cursor:pointer}
.yr b{font:500 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--faint);text-align:right}
.yr .bar{display:flex;height:15px;border-radius:3px;overflow:hidden}
.yr .bar i{display:block;height:100%}
.yr.gap{margin-top:7px}
.yr:active .bar{transform:scale(.99)}

/* chords */
.ch{padding:10px 0 12px;border-top:1px solid var(--line);cursor:pointer}
.ch:first-child{border-top:0}
.ch h4{font:400 21px/1.05 var(--serif);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch h4 span{font:500 14px var(--sans);color:var(--soft);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:2px;height:34px;margin-top:8px}
.strip i{flex:1;display:flex;flex-direction:column;border-radius:3px;overflow:hidden;background:var(--s2);min-width:4px}
.strip i b{flex:1;display:block}
.ch p{margin:6px 0 0;font-size:15px;color:var(--soft);line-height:1.4}
.yticks{display:flex;justify-content:space-between;font:500 12px var(--sans);color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}

/* compare */
.cmp-head{display:grid;grid-template-columns:1fr 64px 1fr;align-items:end;margin-bottom:6px}
.cmp-head div{font:400 26px/1 var(--serif)}
.cmp-head div:last-child{text-align:right}
.cmp-head small{display:block;font:400 13px var(--sans);color:var(--faint);margin-top:4px}
.big{display:flex;align-items:baseline;gap:12px;margin:18px 0 6px}
.big b{font:400 72px/.86 var(--serif);font-variant-numeric:tabular-nums}
.big span{font:400 16px/1.3 var(--sans);color:var(--soft)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.vs .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:12px}
.vs .card h5{margin:0;font:400 21px/1.05 var(--serif)}
.vs .card p{margin:4px 0 0;font-size:14px;color:var(--soft);line-height:1.35}
.duo{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-top:10px}

/* painting */
.picker{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--g)) 12px;padding:2px var(--g);scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker button{flex:none;height:46px;border-radius:var(--r-tile);overflow:hidden;position:relative;opacity:.55;transition:opacity .2s}
.picker button[aria-pressed=true]{opacity:1;box-shadow:0 0 0 2px var(--ground),0 0 0 3.5px var(--ink)}
.picker img{height:46px;display:block}
.hero{position:relative;border-radius:var(--r-tile);overflow:hidden;background:var(--s1);margin:0 auto}
.hero img,.hero canvas{display:block;width:100%;height:100%;object-fit:contain}
.hero canvas{position:absolute;inset:0;opacity:0;transition:opacity .35s var(--ease);image-rendering:pixelated}
.hero.map canvas{opacity:1}
.hero .tag{position:absolute;left:8px;bottom:8px;background:var(--s2);border-radius:999px;padding:5px 10px;font:500 13px var(--sans);color:var(--ink);opacity:0;transition:opacity .2s}
.hero.map .tag{opacity:1}
.cap{font:italic 400 17px/1.3 var(--serif);color:var(--soft);margin:8px 0 0}
.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.voices button{text-align:left}
.voices i{display:block;height:44px;border-radius:var(--r-tile)}
.voices b{display:block;font:500 13px var(--sans);color:var(--soft);margin-top:6px}
.voices span{display:block;font:400 15px/1.1 var(--serif);margin-top:1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.pair a{display:block;height:110px;border-radius:var(--r-tile);text-decoration:none;color:inherit;position:relative}
.pair a span{position:absolute;left:10px;bottom:8px;font:400 21px/1 var(--serif)}
.facts{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.facts dt{color:var(--soft)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.verdict{font:400 21px/1.2 var(--serif);margin:12px 0 0}
.chordcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;margin-top:8px;cursor:pointer;transition:background .15s}
.chordcard[aria-pressed=true]{background:var(--s3);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.chordcard h4{margin:0;font:400 21px/1.05 var(--serif);display:flex;justify-content:space-between;gap:10px}
.chordcard h4 span{font:500 13px var(--sans);color:var(--soft);align-self:center}
.chordcard .sw{display:flex;gap:3px;height:28px;margin:8px 0 6px}
.chordcard .sw i{border-radius:var(--r-tile);display:block}
.chordcard p{margin:0;font-size:15px;color:var(--soft);line-height:1.38}
.meter{height:4px;border-radius:2px;background:var(--s3);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.sec{font:400 30px/1 var(--serif);margin:26px 0 4px}
.secnote{font:400 15px/1.4 var(--sans);color:var(--soft);margin:0 0 6px}

/* art says */
.fcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-top:12px}
.fcard h4{margin:0 0 4px;font:400 26px/1.04 var(--serif)}
.fcard p{margin:8px 0 0;font-size:15px;line-height:1.42;color:var(--soft)}
.fcard .n{font:500 13px var(--sans);color:var(--faint);margin-top:10px;font-variant-numeric:tabular-nums}
.bars2{display:grid;gap:8px;margin-top:12px}
.bars2 .r{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:10px;font-size:14px}
.bars2 .r span{color:var(--soft)}
.bars2 .r b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.bars2 .t{position:relative;height:22px;background:var(--s2);border-radius:4px}
.bars2 .t i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bars2 .t u{position:absolute;top:-3px;bottom:-3px;border-left:1.5px dashed var(--soft);opacity:.7}
.bars2 .t s{position:absolute;top:10px;height:2px;background:rgba(20,19,17,.75);border-left:2px solid rgba(20,19,17,.75);border-right:2px solid rgba(20,19,17,.75);box-sizing:content-box;margin-top:-4px;height:2px;border-top:4px solid transparent;border-bottom:4px solid transparent;background-clip:padding-box}
.pairs{display:grid;gap:8px;margin-top:12px}
.pairs .r{display:grid;grid-template-columns:44px 44px 1fr auto;align-items:center;gap:8px}
.pairs .r i{height:44px;border-radius:var(--r-tile);display:block}
.pairs .r span{font:400 17px/1.1 var(--serif)}
.pairs .r b{font:500 15px var(--sans);font-variant-numeric:tabular-nums}
.foot{font:400 14px/1.45 var(--sans);color:var(--faint);margin:28px 0 24px}
.foot b{color:var(--soft);font-weight:500}
.load{display:grid;place-items:center;height:60vh;font:italic 400 21px var(--serif);color:var(--soft)}
.load i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 14px;background:conic-gradient(#8a6a3a,#3c5a6e,#6a7d43,#8a6a3a);animation:spin 2.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 15px,#000 16px)}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad)}
/* career time scrubber */
.play{flex:none;width:48px;height:48px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .12s var(--ease)}
.play:active{transform:scale(.94)}
.tline{height:56px}
.tline .bars{position:absolute;left:0;right:0;bottom:24px;height:24px;display:flex;align-items:flex-end;gap:1px}
.tline .bars i{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.tline .tr,.tline .fi{top:38px}.tline .th{top:27px}
.tline .ev{position:absolute;bottom:2px;width:2px;height:8px;margin-left:-1px;background:var(--soft);border-radius:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 0;font:500 13px var(--sans);color:var(--soft)}
.legend span{display:flex;align-items:center;gap:6px}
/* the dance */
.hero .base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.hero.dance .base{filter:grayscale(1) brightness(.4) contrast(.9)}
.hero.dance canvas{opacity:1;image-rendering:auto}
.hero.geo .base{filter:brightness(.62) saturate(.8)}
.hero.geo svg{position:absolute;inset:0}
.dctl{display:flex;align-items:center;gap:12px;margin-top:12px}
.dots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px}
.dots::-webkit-scrollbar{display:none}
.dots button{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);transition:transform .15s var(--ease)}
.dots button i{display:flex;width:22px;height:22px;border-radius:50%;overflow:hidden}
.dots button i b{flex:1}
.dots button[aria-pressed=true]{background:var(--s3);box-shadow:inset 0 0 0 1.5px var(--line-2);transform:scale(1.08)}
.dcap{min-height:92px;margin-top:8px}
.dcap h4{font:400 30px/1 var(--serif);margin:0}
.dcap p{font-size:15px;line-height:1.4;color:var(--soft);margin:6px 0 0}
.dcap .meter{max-width:180px}
/* mosaic */
.mosbar{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.mosbar .chip{height:44px;padding:0 16px;font-size:15px}
.legend2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.legend2 button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.legend2 i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px var(--line)}
.legend2 button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--ink)}
/* geometry */
.roses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;text-align:center}
.roses svg{margin:0 auto}
.roses span{display:block;font:400 15px/1.1 var(--serif);margin-top:4px}
.roses b{display:block;font:500 12px var(--sans);color:var(--soft);margin-top:2px}
/* arc */
.film{display:flex;gap:4px;overflow-x:auto;margin:0 calc(-1 * var(--g)) 8px;padding:0 var(--g);scrollbar-width:none}
.film::-webkit-scrollbar{display:none}
.film button{flex:none;position:relative}
.film img{height:64px;display:block;border-radius:4px}
.film span{position:absolute;left:4px;bottom:3px;font:500 11px var(--sans);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.evkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 4px;font:500 13px var(--sans);color:var(--soft)}
.evkey i{display:inline-block;width:1px;height:10px;border-left:1.5px dashed var(--soft);margin-right:6px;vertical-align:-1px}
.arcrow{margin-top:10px}
.arch{display:flex;justify-content:space-between;align-items:baseline}
.arch span{font:400 19px var(--serif)}
.arch b{font:500 14px var(--sans);font-variant-numeric:tabular-nums}
.arch b.soft{color:var(--faint);font-weight:400}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><p class="kicker" id="kick">Color atlas</p><div class="who" id="who" role="group" aria-label="Painter"></div></div>
    <h1 id="title">&nbsp;</h1>
  </header>
  <p class="sub" id="sub">&nbsp;</p>
  <nav class="views" id="views" aria-label="Views"></nav>
  <main id="main" style="padding-bottom:28px"><div class="load"><div><i></i>Gathering two careers of color…</div></div></main>
  <div class="dock" id="dock" hidden></div>
</div>
<pre id="out" hidden></pre>
<script>
"use strict";
// ColorHub Atlas prototype (design/ATLAS/ATLAS.md). Self-contained: no app code is loaded. Served from the repo root
// (python3 -m http.server), it reads the real data: data/gallery (index.bin years, detail shards with each painting's
// 24-color pool), data/artists (the painter's works, birth and death), data/core-names.json and
// design/ATLAS/data/findings.json (design/ATLAS/mine.py). Every number is "as photographed".
const ROOT = "../../";
const ERRS = []; addEventListener("error", e => ERRS.push(String(e.message) + " @" + e.lineno)); addEventListener("unhandledrejection", e => ERRS.push("rej: " + String(e.reason && (e.reason.stack || e.reason))));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (v, d = 0) => (v * 100).toFixed(d) + "%";
const buzz = () => { try { navigator.vibrate && navigator.vibrate(4); } catch (e) {} };

// ---------------- color math: OKLab / OKLCH (Ottosson 2020) ----------------
const lin = v => { v /= 255; return v > .04045 ? ((v + .055) / 1.055) ** 2.4 : v / 12.92; };
const gam = v => { v = v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - .055; return clamp(Math.round(v * 255), 0, 255); };
function rgbOk(r, g, b) {
  r = lin(r); g = lin(g); b = lin(b);
  const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b), m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b), s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
  return [.2104542553 * l + .793617785 * m - .0040720468 * s, 1.9779984951 * l - 2.428592205 * m + .4505937099 * s, .0259040371 * l + .7827717662 * m - .808675766 * s];
}

  const r = await fn(live);
  const main = $("#main"), y = scrollY;
  main.innerHTML = r.html;
  const dock = $("#dock"); dock.hidden = !r.dock; dock.innerHTML = r.dock || "";
  bindSliders(dock);
  if (r.after) r.after(main);
  if (live) scrollTo(0, y);
  writeHash();
  $("#out").textContent = JSON.stringify({ ok: true, v: S.v, iw: innerWidth, sw: document.documentElement.scrollWidth, errs: ERRS });
  setTimeout(() => { $("#out").textContent = JSON.stringify({ ok: true, v: S.v, errs: ERRS, dance: DANCE ? DANCE.k : null, notes: window.__notes, steps: window.__steps }); }, 4000);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-view],[data-who],[data-set],[data-period],[data-c],[data-open],[data-chord],[data-pid],[data-note],[data-chordi],[data-pair]");
  if (!t) return;
  const d = t.dataset; buzz();
  if (d.view) { S.v = d.view; S.sel = null; scrollTo(0, 0); return render(); }
  if (d.who) { if (S.who === d.who) return; S.who = d.who; S.y = null; S.sel = null; FIELD = null; S.t = S.win ? PAINTERS[d.who].y0 : null; if (S.v === "painting") { S.pid = PAINTERS[d.who].works[0].id; S.pair = []; S.chord = -1; } return render(); }
  if (d.set) { S[d.set] = typeof S[d.set] === "number" ? +d.val : d.val; S.sel = null;
    if (d.set === "win") { S.t = S.win ? (S.t == null ? P.y0 : S.t) : null; }
    if (d.set === "pm") { S.sorted = 0; S.step = null; }
    return render(d.set !== "arr"); }
  if (d.period) { const [a, b] = d.period.split("-").map(Number); S.y = a === P.y0 && b === P.y1 ? null : [a, b]; S.sel = null; FIELD = null; return render(true); }
  if (d.c != null) { stopPlay(); S.sel = S.sel === +d.c ? null : +d.c; return render(true); }
  if (d.open) { S.pid = d.open; S.v = "painting"; S.pair = []; S.chord = -1; S.step = null; scrollTo(0, 0); return render(); }
  if (d.chord) { const i = CHORD_IDX[d.chord]; S.chord = S.chord === i ? -1 : i; return render(true); }
  if (d.pid) { S.pid = d.pid; S.pair = []; S.chord = -1; S.map = 0; S.step = null; S.sorted = 0; return render(true); }
  if (d.note != null || d.pair != null) { const i = +(d.note != null ? d.note : d.pair); S.chord = -1; S.step = null;
    S.pair = S.pair.includes(i) ? S.pair.filter(x => x !== i) : [...S.pair.slice(S.pm === "mosaic" ? -3 : -1), i]; return render(true); }
  if (d.chordi != null) { const k = +d.chordi; S.chord = S.chord === k ? -1 : k; S.pair = []; S.step = null; if (S.chord >= 0 && S.pm === "geo") S.pm = "dance"; render(true).then(() => { if (S.chord >= 0) scrollTo({ top: 0, behavior: "smooth" }); }); return; }
});

// ---------------- boot ----------------
(async function boot() {
  try {
    const [gal, bin, meta, names, find] = await Promise.all([J("data/gallery/index.json"), fetch(ROOT + "data/gallery/index.bin").then(r => r.arrayBuffer()), J("data/artists/meta.json"), J("data/core-names.json"), J("design/ATLAS/data/findings.json")]);
    const b = new Uint8Array(bin), y = new Array(gal.n);
    for (let i = 0; i < gal.n; i++) { const o = i * gal.rec, v = b[o] | b[o + 1] << 8; y[i] = v ? v - gal.year0 : null; }
    D.gal = gal; D.years = y; D.meta = meta; D.find = find;
    NAMES = names.map(n => ({ n: n.n, ok: hexOk(n.h) }));
    await Promise.all([loadPainter("vg"), loadPainter("mo")]);
    for (const k in PAINTERS) PAINTERS[k].dot = okHex(meanOk(PAINTERS[k].works.flatMap(w => w.pool.map(p => ({ ok: p.ok, share: p.share }))).map(p => ({ ok: p.ok, share: p.share / PAINTERS[k].works.length }))).map((v, i) => i ? v * 2.2 : v * 1.15));
    if (S.v === "painting" && ![...PAINTERS.vg.works, ...PAINTERS.mo.works].some(w => w.id === S.pid)) S.pid = PAINTERS[S.who].works[0].id;
    await render();
  } catch (e) {
    $("#main").innerHTML = `<div class="load"><div class="err">Couldn't load the archive: ${esc(e.message)}.<br><span style="color:var(--soft)">Serve the repo root with python3 -m http.server and open design/ATLAS/prototype.html.</span></div></div>`;
    $("#out").textContent = JSON.stringify({ ok: false, err: String(e.stack || e) });
  }
})();
</script>
