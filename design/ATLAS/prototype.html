<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0D0B">
<title>Color Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Night Gallery (design/VISUAL-DIRECTION.md). Legibility rule: reading text >= 16px, captions >= 13px, every text color
   >= 4.5:1 on its ground (--soft is 7.8:1 on --ground, 6.7:1 on --s2; --faint is never used for text). */
:root{
  --ground:#0E0D0B; --s1:#171512; --s2:#201E1A; --s3:#2B2823;
  --line:rgba(236,232,223,.10); --line-2:rgba(236,232,223,.22);
  --ink:#ECE8DF; --soft:#A9A497; --paper:#EFEBE3; --paper-ink:#141311; --good:#9AD4AE;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-tile:6px; --r-card:18px; --r-sheet:28px; --ease:cubic-bezier(.2,.8,.2,1); --grow:cubic-bezier(.32,.72,0,1);
  --g:16px; --c:#ECE8DF; --dockh:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--g)}

/* top bar: opaque, three slots (home, where you are, search) */
.bar{position:sticky;top:0;z-index:20;background:var(--ground);height:calc(env(safe-area-inset-top,0px) + 56px);padding-top:env(safe-area-inset-top,0px);transition:box-shadow .2s}
.bar.edge{box-shadow:0 1px 0 var(--line)}
.bar .wrap{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background .15s,transform .12s var(--ease)}
.ib:active{transform:scale(.94);background:var(--s3)}
.bar .here{text-align:center;font:400 19px/1 var(--serif);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.edge .here{opacity:1;transform:none}

/* type */
.kick{font:500 15px/1.3 var(--sans);color:var(--soft);margin:0}
h1{font:400 46px/.95 var(--serif);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h2{font:400 34px/1.04 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
h2 em,h1 em{font-style:italic;color:var(--soft)}
.note{font:italic 400 19px/1.3 var(--serif);color:var(--soft);margin:0}
.body{font:400 16px/1.55 var(--sans);color:var(--soft);margin:10px 0 0;text-wrap:pretty}
.body b{color:var(--ink);font-weight:500}
.cap{font:400 14px/1.45 var(--sans);color:var(--soft);margin:10px 0 0}
section.ch{padding:28px 0 56px}
section.ch + section.ch{border-top:1px solid var(--line)}

/* the hero painting */
.hero{position:relative;margin:20px auto 0;border-radius:var(--r-tile);overflow:hidden;background:var(--s1);touch-action:pan-y}
.hero canvas,.hero img{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero img.base{object-fit:fill}
.hero .hint{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px);background:var(--s2);color:var(--ink);border-radius:999px;padding:10px 16px;font:500 14px var(--sans);white-space:nowrap;opacity:0;transition:opacity .4s,transform .4s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
.hero .hint.on{opacity:1;transform:translate(-50%,0)}
.hero .tag{position:absolute;top:10px;background:var(--s2);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--sans);opacity:0;transition:opacity .4s;pointer-events:none}
.hero .tag.l{left:10px}.hero .tag.r{right:10px}
.hero.val .tag{opacity:1}
.dcap{font:500 13px/1.3 var(--sans);color:var(--soft);margin:0 0 6px;font-variant-numeric:tabular-nums}
.hero .scrim{position:absolute;inset:0;display:grid;place-items:center;font:italic 400 19px var(--serif);color:var(--soft)}
.step{min-height:150px;margin-top:18px}
.step .t{font:400 30px/1.02 var(--serif);margin:0;transition:opacity .3s}
.step .l{font:400 16px/1.5 var(--sans);color:var(--soft);margin:8px 0 0;text-wrap:pretty}
.step .why{font:italic 400 18px/1.35 var(--serif);color:var(--ink);margin:8px 0 0}
.names{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.name{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:999px;background:var(--s1);border:1px solid var(--line);text-decoration:none;font:400 17px var(--serif);transition:transform .12s var(--ease),background .15s}
.name:active{transform:scale(.96);background:var(--s3)}
.name i{width:32px;height:32px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px var(--line)}
.lens{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:18px;width:max-content}
.lens button{height:40px;padding:0 16px;border-radius:999px;font:500 15px var(--sans);color:var(--soft)}
.lens button[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}

/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;margin-top:20px}
.card .lab{font:500 13px/1.2 var(--sans);color:var(--soft);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card .lab i{width:8px;height:8px;border-radius:50%;background:var(--good);display:block}
.card h3{font:400 24px/1.12 var(--serif);margin:0;text-wrap:balance}
.card p{font:400 16px/1.5 var(--sans);color:var(--soft);margin:8px 0 0}
.card .n{font:400 13px/1.4 var(--sans);color:var(--soft);margin-top:10px;font-variant-numeric:tabular-nums}
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.duo{display:flex;align-items:center;gap:12px}
.duo b{font:400 40px/1 var(--serif);font-variant-numeric:tabular-nums}
.duo span{font:400 14px/1.35 var(--sans);color:var(--soft)}
.bigrow{display:flex;align-items:baseline;gap:14px;margin-top:6px}
.bigrow b{font:400 64px/.9 var(--serif);font-variant-numeric:tabular-nums}
.bigrow span{font:400 15px/1.4 var(--sans);color:var(--soft)}

/* relationships list */
.rel{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.rel:first-of-type{border-top:0}
.rel .sw{display:flex;height:44px;border-radius:var(--r-tile);overflow:hidden}
.rel .sw i{display:block}
.rel b{display:block;font:400 21px/1.1 var(--serif);font-weight:400}
.rel span{display:block;font:400 14px/1.4 var(--sans);color:var(--soft);margin-top:2px}
.rel em{font:500 15px var(--sans);font-style:normal;font-variant-numeric:tabular-nums;color:var(--soft)}
.rel[aria-pressed=true] b{color:var(--ink)}
.more{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--s2);font:500 15px var(--sans);margin-top:12px}
.strip{display:flex;gap:8px;overflow-x:auto;margin:14px calc(-1 * var(--g)) 0;padding:2px var(--g) 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;position:relative;border-radius:var(--r-tile);overflow:hidden;scroll-snap-align:start;transition:transform .12s var(--ease)}
.strip button:active{transform:scale(.96)}
.strip img{height:84px;display:block;background:var(--s2)}
.strip span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font:500 13px var(--sans);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));text-align:left;font-variant-numeric:tabular-nums}
.strip button[aria-current=true]{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--ink)}

/* go wider */
.wider{display:block;width:100%;text-align:left;margin-top:40px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;transition:transform .12s var(--ease)}
.wider:active{transform:scale(.985)}
.wider .k{font:500 13px var(--sans);color:var(--soft)}
.wider .t{display:block;font:400 26px/1.1 var(--serif);margin-top:4px}
.wider .pal{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-top:14px}
.wider .pal i{display:block}

/* career field */
.field{display:block;margin:18px auto 0;overflow:visible;touch-action:manipulation}
.bub{cursor:pointer}
.lbl{font:400 14px var(--serif);pointer-events:none}
.lbl.s{font:500 12.5px var(--sans);font-variant-numeric:tabular-nums}
.yearbig{font:400 64px/1 var(--serif);font-variant-numeric:tabular-nums;fill:var(--ink);opacity:.07;pointer-events:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px;font:500 13px var(--sans);color:var(--soft)}
.legend span{display:flex;align-items:center;gap:7px}
.read{display:grid;grid-template-columns:88px 1fr;gap:14px;margin-top:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.read .plate{display:block;border-radius:var(--r-tile);min-height:88px}
.read h3{font:400 26px/1.05 var(--serif);margin:0}
.read h3 a{text-decoration:none}
.read p{font:400 15px/1.45 var(--sans);color:var(--soft);margin:6px 0 0}
.read .when{grid-column:1/-1}
.read .when .strip{margin-top:6px}
.read .when .strip img{height:64px}
/* arc */
.arc{margin-top:16px}
.arcrow{margin-top:14px}
.arch{display:flex;justify-content:space-between;align-items:baseline}
.arch span{font:400 19px var(--serif)}
.arch b{font:500 15px var(--sans);font-variant-numeric:tabular-nums}
.arch b.q{color:var(--soft);font-weight:400;font-size:14px}
.axis{font:500 13px var(--sans);fill:var(--soft)}
.ticks{display:flex;justify-content:space-between;font:500 13px var(--sans);color:var(--soft);margin-top:4px;font-variant-numeric:tabular-nums}
.barc{display:flex;gap:2px;height:30px;margin-top:8px}
.barc i{flex:1;display:flex;flex-direction:column;border-radius:3px;overflow:hidden;background:var(--s2);min-width:3px}
.barc i b{flex:1;display:block}
.surp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.surp button{text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;transition:transform .12s var(--ease)}
.surp button:active{transform:scale(.97)}
.surp img{width:100%;height:120px;object-fit:cover;display:block;background:var(--s2)}
.surp div{padding:12px}
.surp .k{font:500 13px var(--sans);color:var(--soft)}
.surp b{display:block;font:400 19px/1.12 var(--serif);font-weight:400;margin-top:2px}
.surp span{display:block;font:400 14px/1.4 var(--sans);color:var(--soft);margin-top:4px}
.surp .wide{grid-column:1/-1;display:grid;grid-template-columns:120px 1fr}
.surp .wide img{height:100%;min-height:120px}

/* compare */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{height:44px;padding:0 16px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font:500 15px var(--sans);display:flex;align-items:center;gap:8px;transition:transform .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.chip.add{background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px;width:max-content}
.seg button{height:40px;padding:0 16px;border-radius:999px;font:500 15px var(--sans);color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.flyhead{display:grid;grid-template-columns:1fr 70px 1fr;align-items:end;margin-top:20px}
.flyhead div{font:400 24px/1.05 var(--serif)}
.flyhead div:last-child{text-align:right}
.flyhead small{display:block;font:500 13px var(--sans);color:var(--soft);margin-top:4px}

/* picker */
.pick h1{font-size:60px;margin-top:20px}
.search{display:flex;align-items:center;gap:10px;height:52px;border-radius:999px;background:var(--s1);border:1px solid var(--line-2);padding:0 18px;margin-top:22px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:400 17px var(--sans);min-width:0}
.search input::placeholder{color:var(--soft);opacity:.85}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.feat button{text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;transition:transform .12s var(--ease)}
.feat button:active{transform:scale(.97)}
.feat b{display:block;font:400 22px/1.05 var(--serif);font-weight:400}
.feat span{display:block;font:400 13px var(--sans);color:var(--soft);margin-top:4px}
.feat .pal{display:flex;height:40px;border-radius:var(--r-tile);overflow:hidden;margin-bottom:12px}
.feat .pal i{display:block}
.feat .hero1{grid-column:1/-1;position:relative;padding:0;overflow:hidden}
.feat .hero1 img{width:100%;height:220px;object-fit:cover;display:block}
.feat .hero1 div{padding:14px}
.list{margin-top:28px}
.list button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;border-top:1px solid var(--line);text-align:left;gap:12px}
.list button b{font:400 20px/1.15 var(--serif);font-weight:400}
.list button span{font:400 14px var(--sans);color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}

/* the sheet (search from anywhere, or bring in a second painter) */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .panel{background:var(--s1);border-radius:var(--r-sheet) var(--r-sheet) 0 0;max-height:86vh;overflow:auto;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(40px);transition:transform .35s var(--grow);box-shadow:0 -16px 48px rgba(0,0,0,.5)}
.sheet.on .panel{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 10px}

/* the dock: thumb controls for the chapter in view */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;will-change:transform;contain:layout paint;transform:translateY(110%);transition:transform .35s var(--grow)}
.dock.on{transform:none}
.dock::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:36px;background:linear-gradient(transparent,var(--ground));pointer-events:none}
.dock .in{max-width:520px;margin:0 auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:12px var(--g) calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -16px 48px rgba(0,0,0,.55)}
.drow{display:flex;align-items:center;gap:12px;min-height:52px}
.drow + .drow{margin-top:6px}
.play{flex:none;width:52px;height:52px;border-radius:50%;background:var(--paper);color:var(--paper-ink);display:grid;place-items:center;transition:transform .12s var(--ease)}
.play:active{transform:scale(.93)}
.dots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px}
.dots::-webkit-scrollbar{display:none}
.dots button{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);transition:transform .2s var(--ease),background .2s}
.dots button i{display:flex;width:24px;height:24px;border-radius:50%;overflow:hidden}
.dots button i b{flex:1}
.dots button[aria-pressed=true]{background:var(--s3);box-shadow:inset 0 0 0 1.5px var(--line-2);transform:scale(1.08)}
.scrub{position:relative;flex:1;height:52px;touch-action:none;cursor:grab}
.scrub .bars{position:absolute;left:0;right:0;top:4px;height:22px;display:flex;align-items:flex-end;gap:1px}
.scrub .bars i{flex:1;border-radius:2px 2px 0 0;min-height:2px;opacity:.55}
.scrub .tr{position:absolute;left:0;right:0;top:32px;height:6px;border-radius:3px;background:var(--s3)}
.scrub .fi{position:absolute;left:0;top:32px;height:6px;border-radius:3px;background:var(--ink)}
.scrub .ev{position:absolute;top:28px;width:2px;height:14px;margin-left:-1px;background:var(--soft);border-radius:1px}
.scrub .th{position:absolute;top:21px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.6)}
.scrub .tip{position:absolute;bottom:52px;transform:translateX(-50%);background:var(--s3);color:var(--ink);font:500 13px var(--sans);padding:5px 10px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.scrub .tip.on{opacity:1}
.yv{flex:none;width:56px;text-align:right;font:400 28px/1 var(--serif);font-variant-numeric:tabular-nums}
.dseg{display:flex;gap:4px;background:var(--ground);border-radius:999px;padding:3px;flex:1}
.dseg button{flex:1;height:40px;border-radius:999px;font:500 14px var(--sans);color:var(--soft)}
.dseg button[aria-pressed=true]{background:var(--s3);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.dlab{font:500 14px var(--sans);color:var(--soft);flex:none;font-variant-numeric:tabular-nums;width:44px;text-align:right}

.foot{font:400 14px/1.5 var(--sans);color:var(--soft);padding:24px 0 calc(var(--dockh) + 40px)}
.load{display:grid;place-items:center;min-height:70vh;font:italic 400 21px var(--serif);color:var(--soft);text-align:center}
.load i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 14px;background:conic-gradient(#8a6a3a,#3c5a6e,#6a7d43,#8a6a3a);animation:spin 2.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 15px,#000 16px);mask:radial-gradient(circle,transparent 15px,#000 16px)}
@keyframes spin{to{transform:rotate(360deg)}}
.thin{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;margin-top:16px;font:400 15px/1.45 var(--sans);color:var(--soft)}
html.still *{transition:none!important;animation:none!important}
.strip{scroll-padding-left:var(--g)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="bar" id="bar"><div class="wrap">
  <button class="ib" id="home" aria-label="All painters"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="here" id="here">Color atlas</div>
  <button class="ib" id="find" aria-label="Find a painter"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
</div></header>
<main id="main" class="wrap"><div class="load"><div><i></i>Opening the archive…</div></div></main>
<div class="dock" id="dock"><div class="in" id="dockin"></div></div>
<div class="sheet" id="sheet"><div class="panel" id="sheetp"></div></div>
<pre id="out" hidden></pre>
<script>
"use strict";
// ColorHub Atlas v2 (design/ATLAS/ATLAS.md). Self-contained; reads the real repo data when served from the repo root.
const ROOT = "../../";
const ERRS = []; addEventListener("error", e => ERRS.push(String(e.message) + " @" + e.lineno)); addEventListener("unhandledrejection", e => ERRS.push("rej: " + String(e.reason && (e.reason.stack || e.reason))));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pct = (v, d = 0) => (v * 100).toFixed(d) + "%";
const buzz = () => { try { navigator.vibrate && navigator.vibrate(4); } catch (e) {} };

// ---------------- color math: OKLab / OKLCH (Ottosson 2020) ----------------
const lin = v => { v /= 255; return v > .04045 ? ((v + .055) / 1.055) ** 2.4 : v / 12.92; };

// a scrubber with momentum that settles on life events and on years that hold paintings

    const best = [...ratios].sort((a, b) => b[1] - a[1])[0]; const ch = best && best[1] > 40 ? best[0] : null;
